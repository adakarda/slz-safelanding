# Emergency landing pipeline parameters -- one file, all nodes.
#
# PX4 topic names: the `_vN` suffix is appended by the uXRCE-DDS client iff the
# .msg declares a nonzero MESSAGE_VERSION. Verified against PX4 v1.17.0-alpha1
# on this machine. If a PX4 upgrade bumps a version, check
# `ros2 topic list | grep fmu` and edit the *_topic entries here -- never the
# node source. See eland_common/px4_topics.py.

perception_node:
  ros__parameters:
    use_gt_segmentation: true
    model_path: ""
    input_size: [512, 512]
    max_rate_hz: 5.0
    image_topic: "/camera/image"
    segmentation_topic: "/camera/segmentation"
    mask_topic: "/eland/semantic_mask"

mapping_node:
  ros__parameters:
    map_size_m: 40.0
    map_resolution: 0.2
    # seg_cam declares horizontal_fov 1.74 rad = 99.7 deg, inherited from the
    # mono_cam model it was derived from. At the 15 m search altitude that is a
    # 35.6 m wide ground footprint, which fits inside map_size_m with margin.
    camera_hfov_deg: 99.7
    # Map memory. Without it the vehicle cannot land: at 3 m the camera
    # footprint is ~7 m wide, so a memoryless map can never show r_safe=3.0 m
    # of clearance and the candidate is lost exactly during final descent.
    # tau=30 s comfortably covers a 15 m -> 0 m descent.
    memory_tau_s: 30.0
    min_evidence: 0.05
    # Past this tilt the frame starts to include the horizon (at ~40 deg with
    # a 99.7 deg FOV) and rays near it project to absurd distances. Dropping
    # the frame beats fusing a smear.
    max_tilt_deg: 30.0
    camera_info_topic: "/camera/camera_info"
    vehicle_attitude_topic: "/fmu/out/vehicle_attitude"
    map_frame: "map"
    mask_topic: "/eland/semantic_mask"
    map_topic: "/eland/ground_map"
    # Human-readable view of the same grid. RViz cannot render the ground map
    # itself: its Map display expects 0..100 occupancy and this carries class
    # IDs. Set false to save a little CPU once you stop watching.
    debug_image_topic: "/eland/ground_map_colored"
    publish_debug_image: true
    vehicle_local_position_topic: "/fmu/out/vehicle_local_position_v1"

detector_node:
  ros__parameters:
    # The segmentation model's own seven classes, in its own order, plus
    # UNKNOWN(7) which the model never emits and the pipeline needs. See
    # eland_common/classes.py.
    #   0 safe-soft  1 safe-hard  2 terrain-hazard  3 structure
    #   4 water      5 vehicle-animal              6 person      7 unknown
    safe_classes: [0, 1]           # safe-soft, safe-hard
    # Things a landing site owes an absolute separation distance to. Note this
    # is NOT "everything that is not safe": UNKNOWN and TERRAIN_HAZARD are not
    # landable but do not demand 3 m of clearance, they are covered by r_fit.
    hazard_classes: [3, 4, 5, 6]   # structure, water, vehicle-animal, person
    # SORA risk ordering.
    #
    # NOT the thesis table's class weights. Those are inverse-frequency
    # training weights -- weight = 0.35 * sqrt(46.167 / pixel_percent)
    # reproduces all seven to two decimals -- so they rank structure (0.44) as
    # safer than safe-soft (0.61), which says a building is a better landing
    # site than grass because buildings are commoner in the dataset. The
    # weights are kept in classes.py as TRAIN_WEIGHTS for the training side;
    # what follows is what SORA says.
    #
    # safe-hard above safe-soft: tarmac is landable, but it is harder on the
    # airframe and it is where the infrastructure and the traffic are.
    class_risk:
      "0": 0.0                     # safe-soft
      "1": 0.2                     # safe-hard
      "2": 0.7                     # terrain-hazard -- a canopy hides the
                                   # ground under it, so it was never seen
      "3": 1.0                     # structure
      "4": 1.0                     # water
      "5": 1.0                     # vehicle-animal
      "6": 1.0                     # person
      "7": 1.0                     # unknown -> an unevaluated pixel is not a
                                   # cleared one
    # SORA separation from hazards. Absolute and non-negotiable.
    r_hazard: 3.0
    # "Does the aircraft fit here" -- x500 is ~0.5 m across, so this is mostly
    # margin. Splitting this out from r_hazard is what makes a small patch of
    # grass in an empty field selectable; a single 3 m threshold rejected any
    # region under 6 m across regardless of what was around it.
    r_fit: 1.0
    # Distance to the nearest cell of a DIFFERENT class. r_fit cannot see the
    # seam between two landable classes -- safe_classes holds grass and
    # pavement both, and the transform runs on their union -- so a site on the
    # kerb between them reported the clearance of the whole open area.
    # Measured on the pinned landing, distance from the chosen site to the
    # nearest class seam: median 0.80 m and under 2 m on 14 of 22 samples
    # before this, median 7.58 m and never under 2.34 m after. No cost in
    # availability: no empty frames and a first-attempt landing in both the
    # open scene and the paved yard.
    r_class_edge: 2.0
    # Smallest region worth considering, independent of its shape. A radius
    # test alone cannot express this: a long thin strip can clear r_fit
    # everywhere along its spine while offering nowhere sensible to sit.
    min_area_m2: 9.0
    # The radius we would like to fit at the landing site. Clearance beyond
    # this earns nothing in the score, so the vehicle does not trek across the
    # map hunting for the exact centre of the largest meadow.
    r_ideal: 8.0
    # Score = w_risk*risk + w_distance*normalised_distance + w_clearance*shortfall
    # (all 0..1, minimised). w_clearance is what stops it landing on the kerb:
    # with risk identically 0 across grass, the first two terms alone reduce to
    # "nearest eligible cell", which by construction sits on the edge of the
    # exclusion zone.
    w_risk: 0.50
    w_distance: 0.15
    w_clearance: 0.35
    # Ground something crossed within corridor_memory_s, scaled by how
    # recently. A cost, not an exclusion: as a hard mask this layer covered
    # every eligible cell on half the frames of a five-mover landing and the
    # descent was abandoned three times (docs/DURUM.md 19.4).
    w_memory: 0.35
    # Not a CPU limit: a decision frame costs about 5 ms, so this throttle is
    # roughly sixty times slower than the loop could run. It is a stabiliser.
    # Measured by raising it to 4.0 on the pinned three-people, two-vehicle
    # landing: candidate rate 1.46 -> 2.18 Hz, state transitions 5 -> 8, time
    # spent in SEARCH 15.4 -> 31.3 s. Deciding more often made the aircraft
    # change its mind more often, which is not the same as deciding sooner.
    max_rate_hz: 2.0
    map_topic: "/eland/ground_map"
    mask_topic: "/eland/semantic_mask"
    candidate_topic: "/eland/candidate"

    # --- fourth test: where the hazard is going ------------------------
    # The three tests above describe the world as it is now. A vehicle at
    # 3 m/s covers 12 m during a descent, so "3 m from a vehicle" can be
    # satisfied by a spot it will be parked on when the aircraft arrives.
    #
    # This is the layer that is ours rather than SafeLand's: SafeLand reacts to
    # an obstacle entering the safety radius (pause 5 s, then climb and
    # reroute), which is the reactive half kept in the flight mode's
    # HOLD/ABORT states. What is added here runs before it and rules out sites
    # the hazard is heading for.
    #
    # Set false for the comparison run. Same scenario with and without is the
    # only evidence this layer earns its place.
    trajectory_filter_enabled: true
    obstacles_topic: "/eland/dynamic_obstacles"
    # Stale list means "no tracker", not "nothing is moving".
    obstacle_timeout_s: 2.0
    obstacle_min_speed_mps: 0.5
    # Corridor = r_hazard + (base + cross_rate * t) * (2 - confidence).
    # base is the tracker's measured position error (~1.5 m). cross_rate
    # covers error ACROSS the path only: the measured 0.9 m/s of prediction
    # error is almost all along it, and the corridor is a union of discs
    # sampled along that same line, so along-track error is already covered.
    # Adding it to every disc would count it twice and reject half the map.
    pred_sigma_base_m: 1.5
    pred_sigma_cross_rate_mps: 0.25
    # Reject sites whose straight-line approach crosses the corridor too, not
    # just sites inside it. Conservative: it does not ask whether the aircraft
    # would be there at the same moment.
    check_approach_path: true
    # Samples along the predicted path. At 3 m/s over a 10 s horizon that is
    # 2.5 m between disc centres against discs of at least 4.5 m radius, so
    # the corridor has no gaps for an obstacle to be missed through.
    corridor_samples: 12
    # Discount for keeping the site already chosen, while it stays eligible.
    # A corridor that sweeps back and forth makes the winner jump between two
    # far-apart sites, and the flight mode reads a jump as a lost candidate --
    # three of those exhaust the retry budget and end in "committing anyway".
    # Applied after the eligibility tests, so it can prolong a choice but
    # never revive a rejected one.
    w_stickiness: 0.15
    stickiness_radius_m: 3.0
    # Hold the site already chosen while it still passes every test, rather
    # than re-deciding each frame. The eligibility tests run first, so this
    # can prolong a decision but never keep a site the corridor now covers.
    # Without it the winner hops between far-apart sites as the corridor
    # sweeps, and the flight mode counts each hop as a lost candidate.
    latch_site: true
    # Release the latch if something scores better by this much (0..1 scale).
    latch_release_margin: 0.20
    # The held site may be re-found this far away and still count as the same
    # site. Requiring the identical cell made the latch all-or-nothing: one
    # frame in which that cell was not eligible dropped it entirely. Measured
    # in a 90 s hover over traffic, total distance travelled by the published
    # site: 32.7 m and 144.3 m across two runs of the old behaviour against
    # 6.2 m with this, and jumps over 4 m fell from 4 and 10 to zero.
    latch_radius_m: 2.0
    # How long ground that something moved across stays excluded, seconds.
    # 0 disables the memory and leaves only the forward-looking corridor.
    #
    # Measured reason it exists: with only the forward corridor, the aircraft
    # correctly refused the landing site while a vehicle was driving towards
    # it, waited, and then landed on that exact spot the moment the vehicle
    # had passed -- 0.37 m from the line it drives along, which it drove along
    # again shortly afterwards. Something that just drove through here is
    # evidence about the ground, not only about itself.
    corridor_memory_s: 25.0

# Moving-obstacle tracking. Reads the pre-fusion projection, because the fused
# map cannot represent anything that moves: evidence settles at about
# rate * tau (~90 at 3 Hz with tau=30 s) and a vehicle crossing a cell in
# 1.5 s deposits about 5, so it never wins the argmax. Measured, not assumed --
# see tracker_node's header.
tracker_node:
  ros__parameters:
    instant_map_topic: "/eland/ground_map_instant"
    obstacles_topic: "/eland/dynamic_obstacles"
    # Only these classes are allowed to move. A flickering building edge is
    # not an obstacle doing 20 m/s.
    dynamic_classes: [5, 6]  # vehicle-animal, person
    # A person is ~0.28 m^2 from above = 7 cells at 0.2 m resolution, so this
    # cannot go much higher without losing people entirely.
    min_blob_cells: 5
    max_blob_cells: 4000
    # Blobs clipped by the edge of the map are dropped: their centroid tracks
    # the visible half, so an obstacle leaving the map reads as one slowing
    # down. Measured cost of not doing this: 2.09 m/s fitted against a true
    # 3.0 m/s.
    ignore_border_blobs: true
    border_margin_cells: 1
    # At 3 m/s and 3 Hz an obstacle moves 1 m per frame. 4 m absorbs centroid
    # jitter without letting two obstacles trade identities.
    # Trim the history when an obstacle turns round, so the fit is not the
    # average of two opposite directions. 0 disables it, which is the default
    # because it did not survive measurement: at 1.5 m legs the person's
    # fitted speed went from 80% to 83% of the truth and the vehicle from 57%
    # to 61%, both inside the run-to-run spread. Comparing raw consecutive
    # steps instead was far worse -- 32% of the truth -- because the blob
    # centroid moves further between frames than the person does.
    reversal_leg_m: 0.0
    association_radius_m: 4.0
    history_len: 8
    # Tracks coast for this long after the obstacle was last seen, with
    # confidence decaying to zero across the window. An obstacle that leaves
    # the 40 m map is still on the road it was on: forgetting it in 2 s let
    # the aircraft commit to a site during a gap in coverage, and the vehicle
    # then drove across the touchdown point.
    track_timeout_s: 6.0
    # Below this many centroids the track publishes zero velocity and zero
    # confidence rather than a guess: two points always fit a line perfectly,
    # which is arithmetic, not evidence.
    min_observations_for_velocity: 3
    max_speed_mps: 15.0
    # How far ahead the obstacle is extrapolated.
    #
    # 4 s was the first choice and it was measurably too short. A 4 s horizon
    # at 3 m/s protects a 12 m stretch of road, and the descent it is meant to
    # protect takes longer than that: in the first end-to-end run the aircraft
    # committed to a site while the vehicle was outside the map entirely, and
    # the vehicle then drove across the touchdown point -- closest approach
    # 0.10 m. The horizon has to cover the descent, not the next frame.
    #
    # 10 s at 3 m/s is 30 m, which spans the whole 40 m map, so anything
    # visible and heading for the site is caught. Longer than that is not
    # supportable: the prediction is a straight line and the world is not.
    horizon_s: 10.0
    prediction_steps: 5

emergency_landing_mode:
  ros__parameters:
    # Which PX4 internal mode this one takes over, so that a failsafe -- not
    # just an operator button -- can trigger it. "rtl" matches NAV_RCL_ACT's
    # default (Return), so manual-control loss reaches this mode with no PX4
    # parameter changes. Note the side effect: while this is registered, a
    # deliberate RTL also lands here instead of flying home.
    # Options: rtl | land | descend | none
    replace_internal_mode: "rtl"
    search_altitude: 15.0
    # Below this altitude the camera footprint is too small to re-acquire a
    # lost candidate, so losing one here means freezing rather than searching.
    min_radius_altitude: 5.0
    landing_altitude: 2.0
    arrival_radius_m: 1.0
    altitude_tolerance_m: 0.5
    candidate_timeout_s: 3.0
    hold_duration_s: 5.0
    max_horizontal_speed: 3.0
    # Bounds on giving up. Without these the state machine will cycle
    # VALIDATE -> HOLD -> ABORT -> SEARCH forever, or loiter forever with no
    # candidate at all -- either way spending the battery and then falling.
    # Both accept <= 0 to disable, restoring the unbounded behaviour.
    max_landing_attempts: 3
    search_timeout_s: 60.0
    # Descent law, driven by how much of the camera view the landing site
    # fills rather than by altitude:
    #   v_ceiling = clamp(descent_size_gain * sqrt(area_m2), min, max)
    #   v         = clamp(v_ceiling * (1 - area_ratio), min, v_ceiling)
    # descent_size_gain 0.20 puts a 10 m x 10 m pad at the 2.0 m/s ceiling and
    # a 4 m x 4 m pad at 0.8 m/s, so a tight site is approached carefully at
    # every altitude and not only at the end.
    descent_size_gain: 0.20
    descent_min_mps: 0.3
    descent_max_mps: 2.0
    # Only used before the first area measurement arrives.
    descent_altitude_gain: 0.35
    candidate_topic: "/eland/candidate"
    state_topic: "/eland/state"

hud_node:
  ros__parameters:
    # These four are display-only copies of the detector's r_ideal/r_hazard and
    # the mode's descent gains. The live numbers (commanded speed, ceiling,
    # area ratio) come from /eland/state so the HUD cannot disagree with the
    # controller; these are the static settings it annotates them with, so
    # keep them in step if you retune above.
    r_ideal: 8.0
    r_hazard: 3.0
    descent_size_gain: 0.20
    descent_min_mps: 0.3
    descent_max_mps: 2.0
    map_size_px: 520
    panel_width_px: 330
    rate_hz: 5.0
    map_topic: "/eland/ground_map"
    candidate_topic: "/eland/candidate"
    state_topic: "/eland/state"
    hud_topic: "/eland/hud"
    vehicle_local_position_topic: "/fmu/out/vehicle_local_position_v1"

# The two moving obstacles. Read twice: by scripts/gen_world.py, which writes
# their SDF into the world before Gazebo starts, and by obstacle_driver, which
# moves the vehicle while it runs. One set of numbers, so the geometry and the
# motion cannot disagree.
#
# Simulation only. Nothing in the landing pipeline may read these: the whole
# point is that the vehicle infers obstacle motion from its camera. The truth
# topic below exists to MEASURE that inference, not to feed it.
obstacle_driver:
  ros__parameters:
    enable: true
    world_name: "eland_test"
    update_rate_hz: 20.0

    # Walking person, an <actor>. Its path runs 8 m north of the origin --
    # close enough to be in the map the whole time, far enough that it should
    # never touch a landing site chosen at the origin. This is the negative
    # control for the trajectory filter: if the vehicle starts avoiding sites
    # because of this person, the filter is producing false positives.
    #
    # North rather than south to keep it away from the static person at
    # (-6, -6): two same-class blobs 4 m apart is an association test, not a
    # tracking test, and mixing the two hides which one is failing.
    #
    # model | actor. The <actor> is the better-looking option and it does get
    # segmented correctly -- but Gazebo neither publishes its pose nor walks
    # it at the requested speed (traced: a 33.3 s scripted round trip took
    # about 28 s), so with an actor there is no reference to score the
    # estimator against. The model is teleported by this node, so its truth is
    # the pose that was commanded.
    person_name: "dyn_person"
    person_kind: "model"
    # How many of them, and how far apart their parallel routes run. Obstacle
    # 0 walks the leg below; the rest are pushed sideways from it, alternating
    # so the group stays centred on the route, and each is phase-shifted so
    # they do not march in lockstep.
    person_count: 3
    person_spacing_m: 6.0
    # --- how many mobs, and where -------------------------------------
    # Routes are drawn fresh each run, within mob_bounds, clear of anything
    # standing and of each other, and written to worlds/mob_layout.yaml.
    # Both the world and obstacle_driver read that file, so the models and
    # the motion cannot disagree.
    randomize_mobs: true
    # 0 = fresh draw each run; the seed used is printed and recorded in the
    # layout file, so a scenario can be repeated.
    mob_seed: 0
    # Hard cap on moving obstacles. Every extra mob is another blob for the
    # tracker to confuse with its neighbours and another set of discs for the
    # corridor test to rasterise; a scenario should get more varied without
    # getting slower. person_count + vehicle_count are trimmed to fit.
    max_mobs: 6
    mob_bounds: [-30.0, -30.0, 30.0, 30.0]
    # Metres a route keeps from anything standing, and from other routes.
    # 2.5 m, not 4: a route is a line a vehicle drives along, and these
    # obstacles are metres across at most. Four metres of margin on top of the
    # obstacle's own radius left the middle of this world -- trees, fences,
    # poles within thirty metres of the origin -- with almost nowhere a
    # straight 30 m route could go, and the draw returned one mob instead of
    # five.
    mob_clearance_m: 2.5
    mob_route_gap_m: 6.0
    mob_route_length_m: [16.0, 70.0]
    # Routes are drawn through a disc of this radius around the aircraft's
    # start, not anywhere in the world. Traffic the aircraft never sees is not
    # a scenario: the first version scattered five mobs across sixty metres
    # and the tracker had nothing to track for an entire flight.
    mob_focus_radius_m: 18.0
    # ...but not on top of it. A run should not begin with a vehicle already
    # inside the exclusion zone.
    mob_spawn_gap_m: 8.0
    person_start: [-10.0, 8.0]
    person_goal: [10.0, 8.0]
    person_speed: 1.2
    person_z: 1.0

    # Driving vehicle. Its path runs straight through the origin, which is
    # where the default scenario lands, so at 3 m/s it covers the 12 m from
    # "comfortably clear" to "on top of the landing site" in four seconds --
    # inside the prediction horizon and outside what a snapshot of the current
    # map can see. This is the scenario the whole trajectory layer exists for.
    # The turnaround sits outside the 40 m map on purpose. At +/-20 m it
    # happened exactly at the map edge, where the blob is half out of frame,
    # so every reversal was both invisible and mis-measured; the fitted speed
    # came out at 2.09 m/s against a true 3.0. At +/-30 m the vehicle enters,
    # crosses at a constant 3 m/s, leaves, and comes back 20 s later, so a
    # crossing is never far away in a test run.
    vehicle_name: "dyn_vehicle"
    # Same rule as the people. Three vehicles on a 20 s leg cross the map
    # about seven seconds apart, which is traffic rather than a convoy.
    vehicle_count: 2
    vehicle_spacing_m: 9.0
    vehicle_start: [30.0, 0.0]
    vehicle_goal: [-30.0, 0.0]
    vehicle_speed: 3.0
    vehicle_size: [4.4, 1.9, 1.5]
    # once | pingpong. pingpong keeps the obstacle in the scene for the whole
    # run; once lets it leave, which silently turns a long test into a
    # static-world test.
    vehicle_mode: "pingpong"

    truth_topic: "/eland/obstacle_truth"

# The teleoperation station. Most of its behaviour is keys, not parameters;
# these are the few things worth changing without editing the node.
control_station:
  ros__parameters:
    # Sticks are streamed at this rate once manual control is taken. PX4 calls
    # the link lost after COM_RC_LOSS_T of silence, so what matters is not the
    # average but the longest gap -- see stream_report_s.
    manual_rate_hz: 33.0
    # Keep asking for Position mode while the operator is flying and a
    # failsafe keeps taking it away. false restores the old behaviour: the key
    # appears to work and the aircraft lands anyway.
    reassert_manual: true
    reassert_period_s: 2.0
    # Start streaming without a keypress. For timing measurements with no
    # human in the loop; taking control should otherwise be deliberate.
    start_manual: false
    # How often the station reports its own stream regularity, seconds.
    stream_report_s: 10.0
    gcs_heartbeat: true
